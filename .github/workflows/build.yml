name: build

# Builds run on pushes to master and on demand (Actions tab, or
# `gh workflow run build -R cassiostp/firmware-bl616 --ref <branch>`).
# No pull_request trigger: nobody else's code runs here.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned dependency revisions, so builds are reproducible. To bump, run
  #   git ls-remote https://github.com/nand2mario/bouffalo_sdk.git HEAD
  #   git ls-remote https://github.com/bouffalolab/toolchain_gcc_t-head_linux.git HEAD
  # and update the SHAs below (the cache keys follow automatically).
  # Both were the upstream HEAD on 2026-10-08.
  SDK_REPO: https://github.com/nand2mario/bouffalo_sdk.git
  SDK_SHA: 7f44f9ea6b4ccf96db8c5236c8024b68e2a76df7
  TOOLCHAIN_REPO: https://github.com/bouffalolab/toolchain_gcc_t-head_linux.git
  TOOLCHAIN_SHA: c4afe91cbd01bf7dce525e0d23b4219c8691e8f0
  # Sipeed's closed-source BL616 partner image (flashed at 0x0, boots the
  # firmware at 0x40000). Not buildable; taken from the TangCore v0.9 release
  # and checked against these hashes.
  PARTNER_ZIP_URL: https://github.com/nand2mario/tangcore/releases/download/v0.9/tangcore-0.9.zip
  PARTNER_ZIP_SHA256: 0d20bbc6950065d3cce1cadf09a72804742684274bf39314b0c263b7014d939a
  PARTNER_BIN_SHA256: a0cfd9c95a4ae3615dda78ed52bbe48a08fe61095b8e61a774fcb64d7c50a8cc

jobs:
  build:
    name: build (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same list as buildall.bat. CMakeLists.txt also knows mega60k, mega138k,
        # primer25k and nano20k, but buildall.bat has them commented out, so
        # they are not built here.
        board: [console60k, console138k]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/toolchain
          key: toolchain-${{ runner.os }}-${{ env.TOOLCHAIN_SHA }}

      - name: Fetch toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchain && cd ~/toolchain
          git init -q
          git fetch -q --depth 1 "$TOOLCHAIN_REPO" "$TOOLCHAIN_SHA"
          git checkout -q FETCH_HEAD
          rm -rf .git

      - name: Cache Bouffalo SDK
        id: cache-sdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/bouffalo_sdk
          key: sdk-${{ runner.os }}-${{ env.SDK_SHA }}

      - name: Fetch Bouffalo SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/bouffalo_sdk && cd ~/bouffalo_sdk
          git init -q
          git fetch -q --depth 1 "$SDK_REPO" "$SDK_SHA"
          git checkout -q FETCH_HEAD
          # The only submodule (examples/cherryusb) is not used by this firmware;
          # CherryUSB is vendored under components/usb/cherryusb.
          rm -rf .git

      - name: Build
        env:
          TANG_BOARD: ${{ matrix.board }}
        run: |
          export BL_SDK_BASE="$HOME/bouffalo_sdk"
          export PATH="$HOME/toolchain/bin:$PATH"
          riscv64-unknown-elf-gcc --version | head -n 1
          make TANG_BOARD="$TANG_BOARD"

      - name: Collect outputs
        env:
          BOARD: ${{ matrix.board }}
        run: |
          mkdir -p out
          # project(tangcore) + CHIP=bl616 -> build/build_out/tangcore_bl616.bin
          cp build/build_out/tangcore_bl616.bin "out/tangcore_${BOARD}.bin"
          # Same transformation as buildall.bat applies to flash.ini
          sed -e "s/bl616_fpga_partner\.bin/bl616_fpga_partner_${BOARD}.bin/" \
              -e "s/tangcore\.bin/tangcore_${BOARD}.bin/" \
              flash.ini > "out/flash_${BOARD}.ini"
          # Sipeed partner image, so the artifact is a complete flash set
          curl -fsSL -o partner.zip "$PARTNER_ZIP_URL"
          echo "$PARTNER_ZIP_SHA256  partner.zip" | sha256sum -c -
          unzip -p partner.zip "tangcore-0.9/firmware-bl616/bl616_fpga_partner_${BOARD}.bin" \
            > "out/bl616_fpga_partner_${BOARD}.bin"
          echo "$PARTNER_BIN_SHA256  out/bl616_fpga_partner_${BOARD}.bin" | sha256sum -c -
          ls -l out
          {
            echo "### ${BOARD}"
            echo
            echo "Unzip the artifact and flash \`flash_${BOARD}.ini\` with Bouffalo Flash Cube."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tangcore-${{ matrix.board }}
          path: |
            out/tangcore_${{ matrix.board }}.bin
            out/flash_${{ matrix.board }}.ini
            out/bl616_fpga_partner_${{ matrix.board }}.bin
          if-no-files-found: error
